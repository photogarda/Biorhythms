name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into the APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html icon.svg icon-192.png android/app/src/main/assets/
      - name: Build
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Ritmi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ritmi-apk
          path: Ritmi.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ritmi 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Android app. On your phone, download **Ritmi.apk** below, open it and allow "Install unknown apps" for your browser when asked.
            Newer versions install over the old one and keep your people.
          files: Ritmi.apk
