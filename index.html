<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritmi biorhythms</title>
<meta name="theme-color" content="#c62828">
<meta name="description" content="Personal biorhythms calculator. Works offline, data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/*
VOICE: calm, personal, a daily instrument for a family
IDEA: an oscilloscope trace of your own body clock
PICTURE: the wave chart itself, large, today's column lit
COLOUR and TYPE: one chosen accent colour, four rhythm hues, system sans
LAYOUT: phone-first app shell, top bar, content, bottom tab bar
*/
:root{--accent:#c62828;--accent-ink:#fff;--bg:#f6f5f3;--card:#fff;--ink:#1d1b1a;--mute:#6b6662;--line:#e4e0dc;--soft:#efece8;
--p:#e53935;--e:#2e9e4f;--i:#3f51e0;--u:#c446c8;--pos:#2e9e4f;--neg:#e53935;--barP:#7ee08a;--barN:#ff7a72;color-scheme:light}
:root.dark{--bg:#141313;--card:#1e1d1c;--ink:#f1eeeb;--mute:#a39d97;--line:#34312f;--soft:#282625;
--p:#ff6b66;--e:#5fd17e;--i:#8592ff;--u:#e47fe6;--pos:#5fd17e;--neg:#ff6b66;--barP:#2f7d40;--barN:#9c3b37;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--head,var(--accent));color:var(--accent-ink);padding:10px 12px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;border-radius:0 0 18px 18px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.who{flex:1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:0;border-radius:14px;padding:6px 12px 6px 6px;min-height:44px;text-align:left;color:inherit}
.who .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.who b{display:block;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:13px;opacity:.85;line-height:1.2}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.14);color:inherit;display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
main{flex:1;padding:14px 12px}
h1{font-size:24px;line-height:1.15;margin:4px 4px 12px;text-wrap:balance}
h2{font-size:18px;margin:18px 4px 8px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.muted{color:var(--mute)}
.small{font-size:13px}
.datebar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.datebar .lbl{flex:1;text-align:center;font-weight:700;font-size:18px;position:relative;min-height:44px;display:grid;place-items:center;border-radius:12px}
.datebar .lbl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.nb svg{width:20px;height:20px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:36px;font-size:14px;font-weight:600}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fig{position:relative;height:min(62vh,460px);min-height:300px;touch-action:pan-y;user-select:none}
.fig.mini{height:220px;min-height:200px}
.fig svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;border:0;background:var(--soft);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
.row.off{opacity:.45}
.row .dot{width:12px;height:12px;border-radius:50%;grid-row:span 2}
.row .top{display:flex;justify-content:space-between;gap:8px;font-weight:600;flex-wrap:wrap}
.row .top span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;grid-column:2}
.bar i{display:block;height:100%;border-radius:8px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--neg);color:#fff;vertical-align:1px;margin-left:4px}
.overall{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 4px 0;flex-wrap:wrap}
.big{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg)}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:14px;font-weight:600;color:var(--mute)}
.field input,.field select,textarea{min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:16px;width:100%}
textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.opt span small{display:block;color:var(--mute);font-size:13px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--card)}
.sw.on{border-color:var(--ink)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person .main{flex:1;border:0;background:none;text-align:left;padding:4px 0;min-height:44px}
.person .main b{display:block}
.person.sel .main b::after{content:" ✓";color:var(--accent)}
.ritm{border-left:4px solid;padding:8px 12px;margin:8px 0;background:var(--soft);border-radius:0 12px 12px 0}
.ritm h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ritm p{margin:4px 0 0}
.note{margin:12px 0 0}
.note h3{margin:0 0 4px;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--mute);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1.05;border:0;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;position:relative;background:var(--soft)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.cal .dots{display:flex;gap:2px;min-height:7px}
.cal .dots i{width:7px;height:7px;border-radius:50%}
.cal .pc{font-size:11px;font-weight:500;color:var(--mute)}
.list{display:grid;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:1px 8px}
.menu{display:grid}
.menu a{display:flex;align-items:center;gap:14px;padding:12px 4px;min-height:52px;color:inherit;text-decoration:none;border-top:1px solid var(--line);font-weight:600}
.menu a:first-child{border-top:0}
.menu svg{width:22px;height:22px;color:var(--accent);flex:none}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;color:var(--mute);text-decoration:none;font-size:12px;font-weight:600;min-height:60px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .card{width:100%;max-width:520px;max-height:88vh;overflow:auto;margin:0;padding:18px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.empty{text-align:center;padding:24px 12px}
.empty svg{width:120px;height:60px;color:var(--accent)}
.help p,.help li{max-width:68ch}
.help h2{margin-top:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right;font-weight:600}
.hide{display:none!important}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>

<div class="app">
  <header class="top">
    <button class="who" id="who" aria-label="Choose person"><span class="av" id="whoAv">?</span><span><b id="whoName">-</b><small id="whoSub"></small></span></button>

    <button class="ib" id="btnMode" aria-label="Dark mode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>

  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div id="tabs"></div></nav>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" class="hide">

 helpHtml:`<h2>What are biorhythms?</h2><p>Biorhythm theory says that from the day you are born, a few steady cycles run through your life: physical (23 days), emotional (28 days), intellectual (33 days) and intuitive (38 days). Each one is drawn as a sine wave between +1 and −1.</p>
<p><b>Value</b> = sin(2π × days since birth ÷ period). The percentage is the same value on a 0 to 100% scale, where 50% is the middle line. <b>Overall state</b> is the average of the four percentages.</p>
<h2>Critical days</h2><p>A rhythm is critical on the day its wave crosses the middle line. The theory says these switching days are less stable than the highs and lows. They are marked with a ring on the chart and a dot in the calendar.</p>
<h2>Calculation methods</h2><ul><li><b>Standard</b>: whole days since birth.</li><li><b>Midday count</b>: days + 0.5, as if counted from midday. Some birth dates match better with it.</li><li><b>Precise periods</b>: fractional period lengths 23.688437, 28.426125, 33.163812 and 37.9015 days.</li></ul>
<h2>Compatibility</h2><p>For each rhythm the app compares where two people are in their cycles. Born a whole number of cycles apart means 100% (the waves move together); born half a cycle apart means 0% (mirror images). The overall score is the average of the four.</p>
<h2>Chart</h2><p>The chart shows 15 days around the selected date. Tap a day to select it, swipe sideways to move, and tap a rhythm below the chart to hide or show it. The soft columns are the overall state for each day.</p>
<h2>Install on your phone</h2><p>Open the app in Chrome (Android) or Safari (iPhone), open the browser menu and choose "Add to Home screen" or "Install app". After that it opens like a normal app and works without internet.</p>
<h2>Backups</h2><p>Your people are stored only on this device. Use <b>More → Back up people</b> to save a file, and <b>Restore from backup</b> to load it on another phone.</p>
<h2>Reminders</h2><p>The daily notification is best effort because web apps cannot schedule exact alarms. For dependable reminders, use <b>Add critical days to my calendar</b>, which creates calendar events your phone will remind you about.</p>`

 helpHtml:`<h2>Kas ir bioritmi?</h2><p>Bioritmu teorija apgalvo, ka kopš dzimšanas dienas cilvēka dzīvē darbojas vairāki vienmērīgi cikli: fiziskais (23 dienas), emocionālais (28 dienas), intelektuālais (33 dienas) un intuitīvais (38 dienas). Katrs no tiem ir sinusoīda starp +1 un −1.</p>
<p><b>Vērtība</b> = sin(2π × dienas kopš dzimšanas ÷ periods). Procenti ir tā pati vērtība skalā no 0 līdz 100%, kur 50% ir viduslīnija. <b>Kopējais stāvoklis</b> ir četru procentu vidējais.</p>
<h2>Kritiskās dienas</h2><p>Ritms ir kritisks dienā, kad tā vilnis šķērso viduslīniju. Saskaņā ar teoriju šīs pārslēgšanās dienas ir mazāk stabilas nekā kāpumi un kritumi. Grafikā tās iezīmētas ar apli, kalendārā ar punktu.</p>
<h2>Aprēķina metodes</h2><ul><li><b>Standarta</b>: veselas dienas kopš dzimšanas.</li><li><b>Skaitīšana no pusdienlaika</b>: dienas + 0,5. Dažiem dzimšanas datumiem tā atbilst labāk.</li><li><b>Precīzie periodi</b>: daļskaitļu periodi 23,688437, 28,426125, 33,163812 un 37,9015 dienas.</li></ul>
<h2>Saderība</h2><p>Katram ritmam lietotne salīdzina, kurā cikla vietā ir divi cilvēki. Ja dzimšanas dienas atšķiras par veselu ciklu skaitu, saderība ir 100% (viļņi iet kopā); ja par pusciklu, tā ir 0% (spoguļattēli). Kopējā saderība ir četru vidējais.</p>
<h2>Grafiks</h2><p>Grafikā redzamas 15 dienas ap izvēlēto datumu. Pieskarieties dienai, lai to izvēlētos, velciet uz sāniem, lai pārvietotos, un pieskarieties ritmam zem grafika, lai to paslēptu vai parādītu. Gaišie stabiņi rāda katras dienas kopējo stāvokli.</p>
<h2>Instalēšana tālrunī</h2><p>Atveriet lietotni pārlūkā Chrome (Android) vai Safari (iPhone), atveriet izvēlni un izvēlieties "Pievienot sākuma ekrānam" vai "Instalēt lietotni". Pēc tam tā atveras kā parasta lietotne un darbojas bez interneta.</p>
<h2>Rezerves kopijas</h2><p>Cilvēku saraksts glabājas tikai šajā ierīcē. Izmantojiet <b>Vairāk → Saglabāt cilvēku kopiju</b>, lai saglabātu failu, un <b>Atjaunot no kopijas</b>, lai to ielādētu citā tālrunī.</p>
<h2>Atgādinājumi</h2><p>Ikdienas paziņojums darbojas pēc iespējas, jo tīmekļa lietotnes nevar ieplānot precīzus modinātājus. Drošiem atgādinājumiem izmantojiet <b>Pievienot kritiskās dienas kalendāram</b>, kas izveido kalendāra notikumus ar tālruņa atgādinājumiem.</p>`
}};

/* ---------- date + math ---------- */
const dn=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?Math.round(Date.UTC(+m[1],m[2]-1,+m[3])/864e5):null};

function calc(birthN,dayN){
 const n=dayN-birthN,tt=n+offset(),P=periods();
 const r=KEYS.map((k,j)=>{
  const p=P[j],ph=2*Math.PI*tt/p,v=Math.sin(ph),half=p/2,eps=1e-9;
  const m=Math.ceil((tt-.5)/half-eps),crit=m*half<tt+.5-eps;
  const pct=(v+1)*50,rising=Math.cos(ph)>0;
  let st=crit?'crit':v>=.9?'high':v<=-.9?'low':v>0?'pos':'neg';
  const cyc=Math.floor(((tt%p)+p)%p);
  return{k,v:Math.abs(v)<5e-10?0:v,pct,crit,rising,st,cyc,p};
 });
 const overall=r.reduce((a,x)=>a+x.pct,0)/4;
 return{n,r,overall};
}
function compat(bA,bB){const P=periods();const r=P.map(p=>{let f=(((bB-bA)%p)+p)%p/p;return 100*(1-2*Math.min(f,1-f))});return{r,overall:r.reduce((a,b)=>a+b,0)/4}}

 document.querySelector('meta[name=theme-color]').content=a;try{AND&&AND.setBarColor&&AND.setBarColor(dark?mix(a,'#000000',.35):a)}catch(e){}root.lang=s.lang;

function mix(a,b,w){const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=h(a),B=h(b);return'#'+A.map((v,i)=>Math.round(v*(1-w)+B[i]*w).toString(16).padStart(2,'0')).join('')}

/* ---------- chart ---------- */
function drawChart(svg,o){
 const W=svg.clientWidth,H=svg.clientHeight;if(!W||!H)return;
 const {start,count,birth,labels=true,showSel=true}=o;const L=t(),sh=S.settings.show,P=periods(),off=offset();
 const padB=labels?(count>20?22:40):6,top=6,ch=H-padB-top,cw=W/count,mid=top+ch/2,amp=ch/2-6;
 const t0=start-birth+off,X=tt=>(tt-t0)*cw+cw/2,Y=v=>mid-v*amp;
 const tn=todayN();let s='';
 for(let i=0;i<count;i++){
  const n=start+i,x=i*cw,w=ymd(n)[3];
  if(showSel&&n===sel)s+=`<rect x="${x}" y="${top}" width="${cw}" height="${ch}" fill="var(--accent)" opacity=".14"/>`;
  if(n===tn)s+=`<rect x="${x+1}" y="${top+1}" width="${cw-2}" height="${ch-2}" fill="none" stroke="var(--ink)" stroke-opacity=".35" stroke-dasharray="3 3"/>`;
  if(sh.o){const c=calc(birth,n),v=(c.overall-50)/50,y=Y(v);s+=`<rect x="${x+.5}" y="${Math.min(y,mid)}" width="${cw-1}" height="${Math.abs(y-mid)}" fill="${v>=0?'var(--barP)':'var(--barN)'}"/>`}
  if(i)s+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${top+ch}" stroke="var(--line)"/>`;
  if(labels){
   const[,,d]=ymd(n),we=w>4;
   if(count<=20){s+=`<text x="${x+cw/2}" y="${top+ch+17}" text-anchor="middle" font-size="${cw<26?12:14}" font-weight="${n===sel?800:500}" fill="${we?'var(--accent)':'var(--ink)'}">${d}</text><text x="${x+cw/2}" y="${top+ch+34}" text-anchor="middle" font-size="${cw<26?10:12}" fill="${we?'var(--accent)':'var(--mute)'}">${L.wd[w]}</text>`}
   else if(d===1||d%5===0)s+=`<text x="${x+cw/2}" y="${top+ch+16}" text-anchor="middle" font-size="12" fill="var(--mute)">${d}</text>`;
  }
 }
 s+=`<line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--mute)" stroke-opacity=".5"/>`;
 s+=`<text x="4" y="${top+13}" font-size="11" fill="var(--mute)">+1</text><text x="4" y="${top+ch-4}" font-size="11" fill="var(--mute)">−1</text>`;
 const a=t0-.5,b=t0+count-.5,step=Math.max(.05,count/W*2);
 KEYS.forEach((k,j)=>{if(!sh[k])return;const p=P[j];let d='';
  for(let tt=a;tt<=b+1e-9;tt+=step)d+=(d?'L':'M')+X(tt).toFixed(1)+' '+Y(Math.sin(2*Math.PI*tt/p)).toFixed(1);
  s+=`<path d="${d}" fill="none" stroke="${col(k)}" stroke-width="2.6" stroke-linejoin="round"/>`;
  for(let m=Math.ceil(a/(p/2));m*p/2<=b;m++)s+=`<circle cx="${X(m*p/2).toFixed(1)}" cy="${mid}" r="4.5" fill="var(--card)" stroke="${col(k)}" stroke-width="2.2"/>`;
 });
 svg.innerHTML=s;
}
const charts=new Map();
const ro=new ResizeObserver(es=>es.forEach(e=>{const o=charts.get(e.target);if(o)drawChart(e.target,o)}));
function mountChart(svg,o){charts.set(svg,o);ro.observe(svg);drawChart(svg,o)}
function bindSwipe(fig,o,onTap){
 let x0=null,y0=0,moved=false,base=0;
 fig.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;moved=false;base=sel});
 fig.addEventListener('pointermove',e=>{if(x0===null)return;const dx=e.clientX-x0;if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(e.clientY-y0)){moved=true;const cw=fig.clientWidth/o.count,sh=-Math.round(dx/cw);if(base+sh!==sel){sel=base+sh;o.start=sel-7;drawChart(fig.querySelector('svg'),o);updateStats()}}});
 const end=e=>{if(x0===null)return;if(!moved&&e.type==='pointerup'){const r=fig.getBoundingClientRect(),i=Math.floor((e.clientX-r.left)/(r.width/o.count));onTap(o.start+i)}else if(moved)setSel(sel);x0=null};
 fig.addEventListener('pointerup',end);fig.addEventListener('pointercancel',end);fig.addEventListener('pointerleave',e=>{if(moved)end(e)});
}

function forecastText(p,n){
 const L=t(),c=calc(dn(p.birth),n);
 let out=[`${L.forecastFor(p.name,fmtLong(n))}`,''];
 c.r.forEach((x,j)=>out.push(`${L.r[j]}: ${L.st[x.st]}, ${L.cyc(x.cyc,+x.p.toFixed(2))} (${x.pct.toFixed(1)}%)`));
 out.push('',`${L.overallState}: ${c.overall.toFixed(1)}% · ${c.n} ${L.daysAlive}`,'',L.sum[sumIdx(c.overall)]);
 if(c.r.filter(x=>x.crit).length>1)out.push('',L.multi);
 c.r.forEach((x,j)=>{if(['crit','high','low'].includes(x.st))out.push('',`${L.r[j]} · ${L.st[x.st]}: ${L.tx[x.k][x.st]}`)});
 return out.join('\n');
}

function viewCalendar(){
 const p=active(),L=t();if(!p)return emptyView();
 if(calMonth==null){const[y,m]=ymd(sel);calMonth=y*12+m}
 const y=Math.floor(calMonth/12),m=calMonth%12,first=Math.round(Date.UTC(y,m,1)/864e5),dim=new Date(Date.UTC(y,m+1,0)).getUTCDate(),lead=ymd(first)[3],birth=dn(p.birth),tn=todayN(),sh=S.settings.show;
 let cells=L.wd.map(w=>`<div class="wd">${w}</div>`).join('')+'<div></div>'.repeat(lead);
 const crit=[],all=[];
 for(let d=0;d<dim;d++){const n=first+d,c=calc(birth,n),v=(c.overall-50)/50;all.push([n,c.overall]);
  const cr=c.r.filter(x=>x.crit&&sh[x.k]);if(cr.length)crit.push([n,cr]);
  const bg=`color-mix(in srgb, ${v>=0?'var(--pos)':'var(--neg)'} ${Math.round(Math.abs(v)*38)}%, var(--soft))`;
  cells+=`<button data-day="${n}" class="${n===tn?'today ':''}${n===sel?'sel':''}" style="background:${bg}" aria-label="${fmtShort(n)} ${c.overall.toFixed(0)}%"><span>${d+1}</span><span class="pc">${c.overall.toFixed(0)}</span><span class="dots">${cr.map(x=>`<i style="background:${col(x.k)}"></i>`).join('')}</span></button>`}
 const sorted=[...all].sort((a,b)=>b[1]-a[1]);
 const li=arr=>arr.map(([n,o])=>`<div class="li"><span>${fmtLong(n)}</span><b>${o.toFixed(1)}%</b></div>`).join('');
 return`<div class="datebar"><button class="nb" id="pm" aria-label="-">${ic('left')}</button><div class="lbl">${L.months[m][0].toUpperCase()+L.months[m].slice(1)} ${y}</div><button class="nb" id="nm" aria-label="+">${ic('right')}</button></div>
 <div class="card"><div class="cal" id="cal">${cells}</div><div class="chips" style="margin-top:10px">${KEYS.map((k,j)=>sh[k]?`<span class="chip" style="background:${col(k)}">● ${L.r[j]}</span>`:'').join('')}</div></div>
 <div class="card"><h2 style="margin-top:0">${L.critIn(L.months[m]+' '+y)}</h2><div class="list">${crit.length?crit.map(([n,cr])=>`<div class="li"><span>${fmtLong(n)}</span><span class="chips">${cr.map(x=>`<span class="chip" style="background:${col(x.k)}">${L.r[KEYS.indexOf(x.k)]}</span>`).join('')}</span></div>`).join(''):`<p class="muted">${L.noCrit}</p>`}</div></div>
 <div class="card"><h2 style="margin-top:0">${L.monthCurve}</h2><div class="fig mini" id="mfig"><svg role="img" aria-label="Month chart"></svg></div></div>
 <div class="card"><h2 style="margin-top:0">${L.bestDays}</h2>${li(sorted.slice(0,3))}<h2>${L.lowDays}</h2>${li(sorted.slice(-3).reverse())}</div>`;
}

function modal(html,onMount){
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;
 m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))m.remove()});
 document.body.appendChild(m);onMount&&onMount(m);return m;
}
function editPerson(p){
 const L=t();
 modal(`<h2 style="margin-top:0">${p?L.editPerson:L.addPerson}</h2><form id="pf"><div class="field"><label for="pn">${L.name}</label><input id="pn" maxlength="60" autocomplete="off" value="${p?esc(p.name):''}" required></div><div class="field"><label for="pbd">${L.birth}</label><input id="pbd" type="date" max="${isoOf(todayN())}" value="${p?p.birth:''}" required></div><p class="muted small hide" id="perr">${L.needName}</p><div class="btns"><button class="btn pri" type="submit">${L.save}</button><button class="btn" type="button" data-close>${L.cancel}</button>${p?`<button class="btn danger" type="button" id="pdel">${L.del}</button>`:''}</div></form>`,m=>{
  const f=m.querySelector('#pf');setTimeout(()=>m.querySelector('#pn').focus(),50);
  f.onsubmit=e=>{e.preventDefault();const name=m.querySelector('#pn').value.trim(),birth=m.querySelector('#pbd').value;
   if(!name||dn(birth)==null){m.querySelector('#perr').classList.remove('hide');return}
   if(p){p.name=name;p.birth=birth}else{const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.people.push({id,name,birth});S.activeId=id}
   persist();m.remove();render()};
  const d=m.querySelector('#pdel');if(d)d.onclick=()=>{m.remove();modal(`<p style="font-size:17px">${esc(L.delQ(p.name))}</p><div class="btns"><button class="btn pri" id="yes" style="background:var(--neg);border-color:var(--neg)">${L.del}</button><button class="btn" data-close>${L.cancel}</button></div>`,m2=>{m2.querySelector('#yes').onclick=()=>{S.people=S.people.filter(x=>x.id!==p.id);if(S.activeId===p.id)S.activeId=S.people[0]?.id||null;persist();m2.remove();render()}})};
 });
}

 const L=t();if(!S.people.length)return editPerson();
 modal(`<h2 style="margin-top:0">${L.people}</h2>${S.people.map(p=>`<div class="person${p.id===active().id?' sel':''}"><button class="main" data-pick="${esc(p.id)}"><b>${esc(p.name)}</b><span class="small muted">${fmtShort(dn(p.birth))}</span></button></div>`).join('')}<div class="btns" style="margin-top:10px"><button class="btn pri" id="np">${L.addPerson}</button><a class="btn" href="#people" data-close>${L.edit}</a></div>`,m=>{
  m.onclick=e=>{const a=e.target.closest('[data-pick]');if(a){S.activeId=a.dataset.pick;persist();m.remove();render()}else if(e.target===m||e.target.closest('[data-close]'))m.remove()};
  m.querySelector('#np').onclick=()=>{m.remove();editPerson()};
 });
}

/* ---------- backup / restore / ics ---------- */
function fileOut(name,text,type){
 const L=t(),blob=new Blob([text],{type});
 modal(`<h2 style="margin-top:0">${name.endsWith('.ics')?L.icsTitle:L.bkTitle}</h2><p>${name.endsWith('.ics')?esc(L.icsText(active().name)):L.bkText}</p><div class="btns"><button class="btn pri" id="dl">${L.download}</button>${AND||navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type})]})?`<button class="btn" id="sh">${L.share}</button>`:''}<button class="btn" id="cp">${L.copy}</button><button class="btn" data-close>OK</button></div><textarea readonly style="margin-top:12px">${esc(text)}</textarea>`,m=>{
  m.querySelector('#dl').onclick=()=>{if(AND){AND.saveFile(name,text,type);return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)};
  const sh=m.querySelector('#sh');if(sh)sh.onclick=async()=>{if(AND){AND.shareFile(name,text,type);return}try{await navigator.share({files:[new File([blob],name,{type})],title:name})}catch(e){}};
  m.querySelector('#cp').onclick=()=>copyText(text);
 });
}
function doBackup(){fileOut(`ritmi-backup-${isoOf(todayN())}.json`,JSON.stringify({app:'ritmi',format:1,exported:new Date().toISOString(),people:S.people.map(({id,name,birth})=>({id,name,birth})),settings:S.settings},null,2),'application/json')}
function parseBackup(txt){
 try{const o=JSON.parse(txt);const arr=Array.isArray(o)?o:o.people||o.users;if(!Array.isArray(arr))return null;
  const out=arr.map(x=>({id:String(x.id||('p'+Math.random().toString(36).slice(2,9))),name:String(x.name||'').slice(0,60),birth:String(x.birth||x.birthDate||'')})).filter(x=>x.name&&dn(x.birth)!=null);
  return out.length?out:null}catch(e){return null}
}
function doRestore(){
 const L=t();
 modal(`<h2 style="margin-top:0">${L.rsTitle}</h2><p>${L.rsText}</p><button class="btn" id="cf">${L.chooseFile}</button><textarea id="rt" style="margin-top:10px" placeholder="{ ... }"></textarea><p class="small hide" id="re" style="color:var(--neg)">${L.rsBad}</p><div class="btns" style="margin-top:10px"><button class="btn pri" id="ra">${L.rsAdd}</button><button class="btn" id="rr">${L.rsReplace}</button><button class="btn" data-close>${L.cancel}</button></div>`,m=>{
  const fi=$('#fileIn');m.querySelector('#cf').onclick=()=>{fi.value='';fi.onchange=async()=>{const f=fi.files[0];if(f)m.querySelector('#rt').value=await f.text()};fi.click()};
  const go=replace=>{const list=parseBackup(m.querySelector('#rt').value);if(!list){m.querySelector('#re').classList.remove('hide');return}
   if(replace)S.people=list;else list.forEach(x=>{if(!S.people.some(p=>p.name===x.name&&p.birth===x.birth)){if(S.people.some(p=>p.id===x.id))x.id+='-'+Date.now().toString(36);S.people.push(x)}});
   if(!active()||!S.people.some(p=>p.id===S.activeId))S.activeId=S.people[0]?.id||null;persist();m.remove();toast(L.rsDone(list.length));render()};
  m.querySelector('#ra').onclick=()=>go(false);m.querySelector('#rr').onclick=()=>go(true);
 });
}
function doIcs(){
 const p=active(),L=t();if(!p)return editPerson();
 const b=dn(p.birth),tn=todayN(),stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',d8=n=>isoOf(n).replace(/-/g,'');
 const ev=[];for(let n=tn;n<tn+366;n++){const c=calc(b,n),cr=c.r.filter(x=>x.crit);if(!cr.length)continue;
  const names=cr.map(x=>L.r[KEYS.indexOf(x.k)]).join(', ');
  ev.push(['BEGIN:VEVENT',`UID:ritmi-${p.id}-${d8(n)}@ritmi`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d8(n)}`,`DTEND;VALUE=DATE:${d8(n+1)}`,`SUMMARY:${(L.criticalDay+': '+names+' ('+p.name+')').replace(/[,;\\]/g,m=>'\\'+m)}`,`DESCRIPTION:${cr.map(x=>L.tx[x.k].crit).join(' ').replace(/[,;\\]/g,m=>'\\'+m)}`,'TRANSP:TRANSPARENT','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+L.criticalDay,'TRIGGER:-PT3H','END:VALARM','END:VEVENT'].join('\r\n'))}
 fileOut(`ritmi-${p.name.replace(/[^\p{L}\p{N}]+/gu,'-')}-critical.ics`,['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ritmi//Biorhythms//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n'),'text/calendar');
}

/* ---------- notifications (best effort) ---------- */
async function mirrorForSW(){try{if(!('caches'in window))return;const c=await caches.open('ritmi-state');await c.put('./__state.json',new Response(JSON.stringify({people:S.people,activeId:S.activeId,settings:S.settings,texts:{r:t().r,crit:t().criticalDay,overall:t().overallState,sum:t().sum}}),{headers:{'content-type':'application/json'}}))}catch(e){}}
async function enableNotify(){
 const L=t();if(AND){S.settings.notify=true;syncAndroid();AND.enableNotify();toast(L.notifOn);return true}if(!('Notification'in window)){toast(L.notifNo);return false}
 const perm=await Notification.requestPermission();if(perm!=='granted'){toast(L.notifDenied);return false}
 try{const reg=await navigator.serviceWorker?.ready;if(reg&&'periodicSync'in reg){try{await reg.periodicSync.register('ritmi-daily',{minInterval:12*3600*1000});toast(L.notifOn);return true}catch(e){}}}catch(e){}
 toast(L.notifPartial);return true;
}
async function notifyOnOpen(){
 try{if(!S.settings.notify||Notification.permission!=='granted')return;const key='ritmi.lastNotified',tn=isoOf(todayN());if(localStorage.getItem(key)===tn)return;
  const p=active();if(!p)return;const c=calc(dn(p.birth),todayN()),L=t(),cr=c.r.filter(x=>x.crit);
  const body=c.r.map((x,j)=>`${L.rs[j]} ${x.pct.toFixed(0)}%`).join(' · ')+(cr.length?`\n${L.criticalDay}: ${cr.map(x=>L.r[KEYS.indexOf(x.k)]).join(', ')}`:'');
  const reg=await navigator.serviceWorker?.getRegistration();const title=`${p.name}: ${c.overall.toFixed(0)}%`;
  if(reg)reg.showNotification(title,{body,icon:'icon-192.png',tag:'ritmi-daily'});else new Notification(title,{body});
  localStorage.setItem(key,tn)}catch(e){}
}

/* ---------- router ---------- */
const ROUTES={chart:[viewChart,afterChart],day:[viewDay,afterDay],calendar:[viewCalendar,afterCalendar],pair:[viewPair,afterPair],more:[viewMore,afterMore],people:[viewPeople,afterPeople],settings:[viewSettings,afterSettings],help:[viewHelp,()=>{}],about:[viewAbout,()=>{}]};
const TABS=['chart','day','calendar','pair','more'];
function route(){const h=location.hash.slice(1);return ROUTES[h]?h:'chart'}
function render(){
 const r=route(),L=t(),p=active();
 charts.clear();ro.disconnect();updateStats=()=>{};
 $('#view').onclick=null;
 $('#whoName').textContent=p?p.name:L.addPerson;$('#whoAv').textContent=p?p.name.trim()[0].toUpperCase():'+';
 $('#whoSub').textContent=p?`${fmtShort(dn(p.birth))} · ${todayN()-dn(p.birth)} ${L.days}`:L.tagline;
 const parent={people:'more',settings:'more',help:'more',about:'more'}[r]||r;
 $('#tabs').innerHTML=TABS.map(k=>`<a href="#${k}" class="${k===parent?'on':''}">${ic(k)}<span>${L.tabs[k]}</span></a>`).join('');
 $('#view').innerHTML=ROUTES[r][0]();ROUTES[r][1]();
 const af=$('#addFirst');if(af)af.onclick=()=>editPerson();
}
window.addEventListener('hashchange',()=>{document.querySelectorAll('.modal').forEach(m=>m.remove());if(route()==='calendar'){const[y,m]=ymd(sel);calMonth=y*12+m}render();scrollTo(0,0)});
$('#who').onclick=pickPerson;
$('#btnToday').onclick=()=>{calMonth=null;setSel(todayN())};
$('#btnShare').onclick=shareDay;
$('#btnMode').onclick=()=>{S.settings.mode=document.documentElement.classList.contains('dark')?'light':'dark';persist();applyTheme();render()};
window.addEventListener('ritmi-theme',()=>{if(S.settings.mode==='system'){applyTheme();render()}});
new MutationObserver(()=>{if(S.settings.mode==='system'){applyTheme();render()}}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
applyTheme();render();mirrorForSW();syncAndroid();
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').then(()=>notifyOnOpen()).catch(()=>notifyOnOpen())}
}
</script>
